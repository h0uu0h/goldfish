version: '3.9'
services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network
    volumes:
      # 1. 挂载 Nginx 配置文件
      # 作用：用你本地修改过的 nginx.conf 覆盖容器里原来的配置
      # 这样你就不用每次改配置都删除镜像重新构建了
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

      # 2. 挂载 RockRock 的静态文件
      # 作用：把你放进 rockrock_dist 的文件，映射到容器内的 /usr/share/nginx/html/rockrock
      # 这里的容器内路径必须和你 nginx.conf 里的 alias 路径一致
      - ./static_sites/rockrock_dist:/usr/share/nginx/html/rockrock
      # 3. 新增 CPC 挂载
      # ============================
      # 宿主机路径 (git里的目录) : 容器内路径 (nginx alias 指向的目录)
      - ./static_sites/cpc_dist:/usr/share/nginx/html/cpc
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
